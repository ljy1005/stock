<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资金大管家</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --primary:#4f46e5; --primary2:#7c3aed;
  --deposit:#10b981; --wealth:#3b82f6; --fund:#f59e0b; --stock:#8b5cf6;
  --danger:#ef4444; --warn:#f97316;
  --ink:#1e293b; --muted:#64748b; --line:#e2e8f0; --bg:#eef2f7;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#eef2f7,#e6ecf5);color:var(--ink);min-height:100vh}
.app{max-width:1440px;margin:0 auto;padding:20px}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.topbar{background:linear-gradient(120deg,#4f46e5,#7c3aed 55%,#9333ea);border-radius:20px;padding:18px 24px;color:#fff;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;box-shadow:0 10px 30px rgba(79,70,229,.28)}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;border-radius:15px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:28px}
.brand h1{font-size:21px;font-weight:700;letter-spacing:.5px}
.brand .sub{font-size:12px;opacity:.85;margin-top:2px}
.top-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.refdate{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.15);padding:6px 10px;border-radius:12px}
.ref-label{font-size:12px;opacity:.9}
.refdate input{border:none;background:#fff;color:var(--ink);border-radius:8px;padding:5px 8px;font-size:13px;outline:none}

.btn{border:none;cursor:pointer;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;transition:.18s;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:#fff;color:var(--primary)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.btn.solid{background:linear-gradient(120deg,var(--primary),var(--primary2));color:#fff}
.btn.solid:hover{filter:brightness(1.08)}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.28)}
.btn.outline{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.outline:hover{border-color:var(--primary);color:var(--primary)}
.btn.small{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.danger{color:#fecaca}
.btn:active{transform:scale(.97)}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0}
.ov-card{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 4px 18px rgba(30,41,59,.06);display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;border-top:3px solid var(--c)}
.ov-ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px}
.ov-val{font-size:21px;font-weight:800;letter-spacing:.2px}
.ov-lab{font-size:13px;color:var(--muted);margin-top:2px}
.ov-sub{font-size:11px;color:var(--muted);margin-top:3px}

.tabs{display:flex;gap:8px;margin:6px 0 16px;flex-wrap:wrap}
.tab{border:none;cursor:pointer;background:#fff;color:var(--muted);padding:11px 20px;border-radius:13px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(30,41,59,.05);transition:.18s}
.tab:hover{color:var(--primary)}
.tab.active{background:linear-gradient(120deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 6px 18px rgba(79,70,229,.3)}
.tabpane{display:none}
.tabpane.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:14px;box-shadow:0 3px 12px rgba(30,41,59,.05);margin-bottom:14px}
.search{flex:1;min-width:200px;border:1.5px solid var(--line);border-radius:11px;padding:9px 14px;font-size:14px;outline:none;transition:.15s}
.search:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
select{border:1.5px solid var(--line);border-radius:11px;padding:9px 12px;font-size:13px;background:#fff;color:var(--ink);outline:none;cursor:pointer;max-width:200px}
select:focus{border-color:var(--primary)}
.count{font-size:13px;color:var(--muted);margin-left:auto;font-weight:600}

.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 18px rgba(30,41,59,.06)}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:4px;height:16px;border-radius:3px;background:linear-gradient(var(--primary),var(--primary2))}
.table-wrap{overflow:auto;border-radius:12px;border:1px solid var(--line);max-height:640px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:1100px}
.tbl th{background:#f8fafc;color:var(--muted);font-weight:700;text-align:left;padding:11px 12px;white-space:nowrap;position:sticky;top:0;z-index:2;border-bottom:2px solid var(--line);font-size:12px}
.tbl td{padding:10px 12px;border-bottom:1px solid #f1f5f9;white-space:nowrap;vertical-align:middle}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:#f5f7ff}
.tbl .num{text-align:right}
.tbl .name{font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.tbl .note{max-width:160px;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.tbl.small{min-width:600px}
tr.row-over{background:#fef2f2}
tr.row-urgent{background:#fff7ed}
tr.row-soon{background:#fffbeb}
tr.row-over:hover{background:#fee2e2!important}
tr.row-urgent:hover{background:#ffedd5!important}
tr.row-soon:hover{background:#fef3c7!important}
.empty{text-align:center;color:var(--muted);padding:34px!important}

.tbadge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.b-over{background:#fee2e2;color:#dc2626}
.b-today{background:#ffedd5;color:#ea580c}
.b-urgent{background:#ffedd5;color:#ea580c}
.b-soon{background:#fef3c7;color:#d97706}
.b-mid{background:#fef9c3;color:#ca8a04}
.b-far{background:#dbeafe;color:#2563eb}
.b-vfar{background:#dcfce7;color:#16a34a}

.ops{display:flex;gap:6px}
.icon{border:none;cursor:pointer;width:30px;height:30px;border-radius:9px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;transition:.15s;background:#f1f5f9}
.icon.edit:hover{background:#e0e7ff}
.icon.del:hover{background:#fee2e2}

.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart-card.wide{grid-column:span 2}
.donut-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.donut{width:170px;height:170px;border-radius:50%;position:relative;flex-shrink:0}
.donut-hole{position:absolute;inset:26px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px #f1f5f9}
.donut-total{font-size:19px;font-weight:800}
.donut-sub{font-size:11px;color:var(--muted)}
.donut-legend{flex:1;min-width:200px;display:flex;flex-direction:column;gap:7px}
.lg-item{display:flex;align-items:center;gap:8px;font-size:13px}
.lg-dot{width:11px;height:11px;border-radius:4px;flex-shrink:0}
.lg-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-val{font-weight:700}
.lg-pct{color:var(--muted);width:52px;text-align:right}
.hb-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hb-label{width:120px;font-size:12px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.hb-track{flex:1;background:#f1f5f9;border-radius:8px;height:20px;overflow:hidden}
.hb-fill{height:100%;border-radius:8px;transition:width .5s}
.hb-val{width:96px;font-size:12px;font-weight:700;text-align:right}
.vb-wrap{display:flex;align-items:flex-end;gap:14px;height:210px;padding:10px 4px 0}
.vb-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.vb-val{font-size:11px;font-weight:700;color:var(--muted)}
.vb-bar{width:100%;max-width:52px;border-radius:8px 8px 3px 3px;min-height:3px;transition:height .5s}
.vb-label{font-size:11px;color:var(--muted);white-space:nowrap}

.remind-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:14px;color:var(--muted)}
.remind-head b{color:var(--ink);font-size:16px}
.rcards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
.rcard{background:#fff;border-radius:16px;padding:15px 16px;box-shadow:0 3px 12px rgba(30,41,59,.06);border-left:4px solid var(--c);position:relative}
.rc-ic{font-size:18px;margin-bottom:6px}
.rc-num{font-size:24px;font-weight:800;color:var(--c)}
.rc-unit{font-size:12px;color:var(--muted);font-weight:600;margin-left:2px}
.rc-amt{font-size:12px;color:var(--muted);margin-top:2px;font-weight:600}
.rc-label{font-size:12px;color:var(--muted);margin-top:7px;font-weight:600}

.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:20px;width:min(680px,94vw);max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .22s ease}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:17px}
.close{border:none;background:#f1f5f9;width:32px;height:32px;border-radius:10px;font-size:18px;cursor:pointer;color:var(--muted)}
.close:hover{background:#fee2e2;color:#dc2626}
.modal-body{padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:span 2}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select{border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font-size:14px;outline:none;transition:.15s;width:100%;max-width:none;background:#fff}
.field input:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.field-row{display:flex;gap:8px;align-items:center}
.field-row input{flex:1}
.modal-foot{display:flex;align-items:center;gap:10px;padding:16px 24px;border-top:1px solid var(--line);flex-wrap:wrap}
.spacer{flex:1}
.btn-cancel{background:#f1f5f9;color:var(--ink)}
.btn-cancel:hover{background:#e2e8f0}

.dict-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:20px 24px}
.dict-sec{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.dict-head{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:7px;max-height:300px;overflow:auto;padding:2px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 7px 5px 12px;font-size:13px}
.chip-x{border:none;background:#f1f5f9;cursor:pointer;color:#94a3b8;font-size:13px;line-height:1;padding:2px 6px;border-radius:50%;transition:.15s}
.chip-x:hover{background:#fee2e2;color:#dc2626}
.dict-add{display:flex;gap:8px;margin-top:auto}
.dict-add input{flex:1;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;outline:none}
.dict-add input:focus{border-color:var(--primary)}
.dict-tip{padding:0 24px 6px;font-size:12px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#dc2626}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:22px 0 8px}
@media(max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr)}.charts-grid{grid-template-columns:1fr}.chart-card.wide{grid-column:span 1}.rcards{grid-template-columns:repeat(2,1fr)}.modal-body{grid-template-columns:1fr}.field.full{grid-column:span 1}.dict-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">💰</div>
      <div><h1>资金大管家</h1><div class="sub">存款 · 理财 · 基金 · 证券 一站式管理</div></div>
    </div>
    <div class="top-actions">
      <div class="refdate"><span class="ref-label">提醒基准日</span><input type="date" id="refDateInput"><button class="btn ghost small" id="todayBtn">今天</button></div>
      <button class="btn primary" id="addBtn">＋ 新增</button>
      <button class="btn ghost" id="importBtn">📥 导入Excel</button>
      <button class="btn ghost" id="exportBtn">📤 导出Excel</button>
      <button class="btn ghost" id="dictBtn">🏷️ 选项维护</button>
      <button class="btn ghost small" id="sampleBtn" title="重新生成随机示例数据">示例</button>
      <button class="btn ghost small danger" id="clearBtn" title="清空数据">清空</button>
      <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
    </div>
  </header>

  <section class="stats-grid" id="statsGrid"></section>

  <nav class="tabs">
    <button class="tab active" data-tab="list">📋 数据列表</button>
    <button class="tab" data-tab="stats">📊 统计分析</button>
    <button class="tab" data-tab="remind">⏰ 到期提醒</button>
  </nav>

  <div class="panel">
    <div id="tab-list" class="tabpane active"></div>
    <div id="tab-stats" class="tabpane"></div>
    <div id="tab-remind" class="tabpane"></div>
  </div>
  <div class="footer">数据与选项库均保存在浏览器本地（localStorage） · 导入将替换当前数据 · 建议定期导出 Excel 备份</div>
</div>

<!-- 新增/编辑弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle">新增记录</h3><button class="close" id="modalClose">×</button></div>
    <div class="modal-body">
      <div class="field"><label>名称 *</label><input id="f_name" placeholder="如：3年定期"></div>
      <div class="field"><label>平台 / 银行 *</label><select id="f_platform"></select></div>
      <div class="field"><label>类型</label><select id="f_type"></select></div>
      <div class="field"><label>渠道</label><select id="f_channel"></select></div>
      <div class="field"><label>金额（元）</label><input id="f_amount" type="number" step="0.01" placeholder="0.00"></div>
      <div class="field"><label>利率（%）</label><input id="f_rate" type="number" step="0.001" placeholder="如 3.1"></div>
      <div class="field"><label>期限（天）</label><input id="f_term" placeholder="如 1095 / 7日后"></div>
      <div class="field"><label>到期金额（元）</label><input id="f_maturity" type="number" step="0.01" placeholder="0.00"></div>
      <div class="field"><label>存入时间</label><input id="f_start" type="date"></div>
      <div class="field"><label>到期时间</label>
        <div class="field-row">
          <input id="f_end" type="date">
          <button type="button" class="btn outline small" id="calcEndBtn" title="按 存入时间 + 期限 计算">计算</button>
        </div>
      </div>
      <div class="field full"><label>备注</label><input id="f_note" placeholder="选填"></div>
    </div>
    <div class="modal-foot">
      <button class="btn outline small" id="calcBtn">🧮 按单利估算到期金额</button>
      <button class="btn outline small" id="dictFromForm">🏷️ 维护选项</button>
      <span class="spacer"></span>
      <button class="btn btn-cancel" id="cancelBtn">取消</button>
      <button class="btn solid" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<!-- 选项库维护弹窗 -->
<div class="modal-mask" id="dictMask" style="z-index:70">
  <div class="modal" style="width:min(860px,95vw)">
    <div class="modal-head"><h3>🏷️ 选项库维护</h3><button class="close" id="dictClose">×</button></div>
    <div class="dict-tip">添加后可在「新增 / 编辑」下拉框中直接选用；删除选项不会影响已有记录；导入 Excel 时会自动收录新选项。</div>
    <div class="dict-grid" id="dictGrid"></div>
    <div class="modal-foot">
      <button class="btn outline small" id="dictReset">↺ 恢复默认选项</button>
      <span class="spacer"></span>
      <button class="btn solid" id="dictDone">完成</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== 随机示例数据生成 ===================== */
const BANKS=['百信银行','华通银行','华瑞银行','众邦银行','裕民银行','新安银行','振兴银行','上海银行','中国建设银行','招商银行','微众银行','中国银行','工商银行','苏宁银行','蓝海银行','亿联银行','金城银行','客商银行','网商银行','中关村银行'];
const CHANNELS=['手机银行APP','银行小程序','京东金融','支付宝','微信银行','星图金融'];
const PRODUCTS=['乐存宝','鑫享利','旺财存款','心意存','惠享存','多帮利','蓝贝贝','客惠存','金利宝','安享存'];
const ALL_PLATFORMS=BANKS.concat(['天天基金','东方财富','招商证券']);

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function SAMPLE(){
  const rnd=mulberry32(20250817);
  const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  const pick=arr=>arr[Math.floor(rnd()*arr.length)];
  const today=new Date();today.setHours(0,0,0,0);
  const dAdd=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
  const TERMS=[90,180,365,730,1095,1826];
  const TERM_NAME={90:'90天',180:'180天',365:'1年',730:'2年',1095:'3年',1826:'5年'};
  const AMTS=[1000,2000,3000,5000,5000,8000,10000,10000,10000,20000,30000,50000];
  const rateFor=t=>{if(t<=180)return[1.3,2.0];if(t<=365)return[1.5,2.4];if(t<=730)return[1.9,2.9];if(t<=1095)return[2.1,3.5];return[2.3,3.9];};
  const items=[];let seq=1;

  function addDeposit(daysUntil,type,name){
    const cand=TERMS.filter(t=>t>daysUntil+30);
    let term=cand.length?pick(cand):(daysUntil+ri(120,365));
    if(type&&type.includes('不可动'))term=1826;
    const[rmin,rmax]=rateFor(term);
    const rate=+(rmin+rnd()*(rmax-rmin)).toFixed(2);
    const amount=pick(AMTS);
    const maturityAmt=+(amount*(1+rate/100*term/365)).toFixed(2);
    const start=dAdd(today,daysUntil-term),end=dAdd(today,daysUntil);
    const nm=name||(rnd()<0.55?((TERM_NAME[term]||term+'天')+'定期'):pick(PRODUCTS));
    const isLock=type&&type.includes('不可动');
    items.push({_id:seq,序号:seq++,名称:nm,平台:pick(BANKS),类型:type||'存款',渠道:pick(CHANNELS),
      金额:amount,利率:rate,期限:term,到期金额:maturityAmt,
      存入时间:fmtDate(start),到期时间:fmtDate(end),备注:isLock?'养老金':''});
  }
  /* 固定分布：覆盖到期提醒各档位 */
  [-28,-12,-3,2,5,9,15,26,42,66,85,120,165,260,330,520,760,1050,1500].forEach(d=>addDeposit(d));
  for(let i=0;i<18;i++)addDeposit(ri(-20,1600));
  addDeposit(1600,'存款（不可动）','享定存5年期');
  addDeposit(1750,'存款（不可动）','享定存5年期');

/* ===================== 工具函数 ===================== */
function esc(s){if(s==null)return'';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function num(v){if(v==null||v==='')return'';if(typeof v==='number')return v;let s=String(v).replace(/[¥￥,\s]/g,'').replace('%','');const n=parseFloat(s);return isNaN(n)?'':n;}
function parseDate(v){
  if(!v&&v!==0)return null;
  if(v instanceof Date)return isNaN(v)?null:v;
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*86400*1000));return isNaN(d)?null:d;}
  let s=String(v).trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){let y=parseInt(m[3],10);if(y<100)y+=2000;return new Date(y,parseInt(m[1],10)-1,parseInt(m[2],10));}
  m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  const d=new Date(s);return isNaN(d)?null:d;
}
function fmtDate(d){if(!d)return'';return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');}
function toInputDate(d){if(!d)return'';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayDiff(from,to){const a=new Date(from.getFullYear(),from.getMonth(),from.getDate());const b=new Date(to.getFullYear(),to.getMonth(),to.getDate());return Math.round((b-a)/86400000);}
function fmtMoney(n){if(n==null||n===''||isNaN(n))return'—';return'¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtShort(n){if(n>=100000000)return(n/100000000).toFixed(2)+'亿';if(n>=10000)return(n/10000).toFixed(1)+'万';return n.toFixed(0);}
function typeColor(t){if(!t)return'#94a3b8';if(t.includes('存款'))return'#10b981';if(t.includes('理财'))return'#3b82f6';if(t.includes('基金'))return'#f59e0b';if(t.includes('证券'))return'#8b5cf6';return'#94a3b8';}
function maturityInfo(d){const md=parseDate(d.到期时间);if(!md)return null;return{date:md,days:dayDiff(refDate,md)};}
function maturityBadge(d){const mi=maturityInfo(d);if(!mi)return'<span class="muted">—</span>';const dd=mi.days;let cls,txt;
  if(dd<0){cls='b-over';txt='已到期'+(-dd)+'天';}else if(dd===0){cls='b-today';txt='今日到期';}
  else if(dd<=7){cls='b-urgent';txt=dd+'天后到期';}else if(dd<=30){cls='b-soon';txt=dd+'天后到期';}
  else if(dd<=90){cls='b-mid';txt=dd+'天后到期';}else if(dd<=365){cls='b-far';txt=dd+'天后到期';}
  else{cls='b-vfar';txt=dd+'天后到期';}return`<span class="badge ${cls}">${txt}</span>`;}
function urgencyClass(d){const mi=maturityInfo(d);if(!mi)return'';if(mi.days<0)return'row-over';if(mi.days<=7)return'row-urgent';if(mi.days<=30)return'row-soon';return'';}
let toastTimer;function toast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+(type||'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='toast',2200);}

/* ===================== 到期时间计算 ===================== */
function parseTermDays(termRaw){
  const t=String(termRaw==null?'':termRaw).trim();
  if(t==='')return null;
  if(isFinite(t))return Number(t);
  const m=t.match(/^\s*(\d+)/);
  return m?parseInt(m[1],10):null;
}
function computeEnd(startStr,termRaw){
  const start=parseDate(startStr);
  if(!start)return null;
  const days=parseTermDays(termRaw);
  if(days==null||isNaN(days))return null;
  return new Date(start.getFullYear(),start.getMonth(),start.getDate()+days);
}
function calcEnd(force){
  const endEl=document.getElementById('f_end');
  if(!force&&endEl.value)return;
  const end=computeEnd(document.getElementById('f_start').value,document.getElementById('f_term').value);
  if(!end){if(force)toast('请先填写存入时间和数字期限（天）','err');return;}
  endEl.value=toInputDate(end);
  if(force)toast('已计算到期时间：'+fmtDate(end));
}

function drawTable(){
  let arr=deposits.slice();
  if(searchTerm){const q=searchTerm.toLowerCase();arr=arr.filter(d=>[d.名称,d.平台,d.渠道,d.备注,d.类型].some(v=>String(v||'').toLowerCase().includes(q)));}

  if(filterPlatform)arr=arr.filter(d=>d.平台===filterPlatform);
  arr.sort((a,b)=>{let va,vb;switch(sortBy){
    case'金额':va=Number(a.金额)||0;vb=Number(b.金额)||0;break;
    case'利率':va=Number(a.利率)||0;vb=Number(b.利率)||0;break;
    case'到期时间':va=parseDate(a.到期时间)||new Date(8640000000000000);vb=parseDate(b.到期时间)||new Date(8640000000000000);return(va-vb)*sortDir;
    case'存入时间':va=parseDate(a.存入时间)||new Date(8640000000000000);vb=parseDate(b.存入时间)||new Date(8640000000000000);return(va-vb)*sortDir;
    default:va=Number(a.序号)||0;vb=Number(b.序号)||0;}
    return(va>vb?1:va<vb?-1:0)*sortDir;});
  const tbody=document.getElementById('tbody');

function groupSum(key,colorFn){const m={};deposits.forEach(d=>{const k=d[key]||'未分类';m[k]=(m[k]||0)+(Number(d.金额)||0);});

function doughnut(el,data){const total=data.reduce((s,d)=>s+d.value,0);if(total<=0){el.innerHTML='<div class="empty">暂无数据</div>';return;}

function platformTable(el){const m={};deposits.forEach(d=>{const k=d.平台||'未分类';if(!m[k])m[k]={n:0,p:0,interest:0,rates:[]};m[k].n++;m[k].p+=Number(d.金额)||0;
  if(d.到期金额!=null&&d.到期金额!==''&&d.金额!=null&&d.金额!=='')m[k].interest+=(Number(d.到期金额)||0)-(Number(d.金额)||0);
  const r=Number(d.利率);if(!isNaN(r)&&d.利率!==''&&d.利率!=null)m[k].rates.push(r);});
  const arr=Object.entries(m).map(([k,v])=>({k,...v,avg:v.rates.length?v.rates.reduce((a,b)=>a+b,0)/v.rates.length:null})).sort((a,b)=>b.p-a.p);
  el.innerHTML=`<div class="table-wrap" style="max-height:340px"><table class="tbl small"><thead><tr><th>平台</th><th class="num">笔数</th><th class="num">本金</th><th class="num">预期利息</th><th class="num">平均利率</th></tr></thead><tbody>
  ${arr.map(r=>`<tr style="cursor:default"><td>${esc(r.k)}</td><td class="num">${r.n}</td><td class="num mono">${fmtMoney(r.p)}</td><td class="num mono" style="color:#16a34a">${fmtMoney(r.interest)}</td><td class="num mono">${r.avg?r.avg.toFixed(2)+'%':'—'}</td></tr>`).join('')}</tbody></table></div>`;}

/* ===================== 到期提醒 ===================== */
function renderRemind(){
  const el=document.getElementById('tab-remind');
  const items=deposits.map(d=>({d,mi:maturityInfo(d)})).filter(x=>x.mi).sort((a,b)=>a.mi.days-b.mi.days);
  const b={over:[],d7:[],d30:[],d90:[],d180:[],far:[]};
  items.forEach(x=>{const dd=x.mi.days;if(dd<0)b.over.push(x);else if(dd<=7)b.d7.push(x);else if(dd<=30)b.d30.push(x);else if(dd<=90)b.d90.push(x);else if(dd<=180)b.d180.push(x);else b.far.push(x);});
  const card=(label,arr,color,icon)=>{const amt=arr.reduce((s,x)=>s+(Number(x.d.金额)||0),0);
    return`<div class="rcard" style="--c:${color}"><div class="rc-ic">${icon}</div><div class="rc-num">${arr.length}<span class="rc-unit">笔</span></div><div class="rc-amt mono">${fmtShort(amt)}</div><div class="rc-label">${label}</div></div>`;};
  let html=`<div class="remind-head">提醒基准日：<b>${fmtDate(refDate)}</b><button class="btn outline small" id="rToday">设为今天</button><span class="muted">共 ${items.length} 笔含到期时间</span></div>`;
  html+=`<div class="rcards">${card('已到期',b.over,'#ef4444','⚠️')}${card('7天内到期',b.d7,'#f97316','🔥')}${card('8-30天',b.d30,'#f59e0b','⏳')}${card('31-90天',b.d90,'#eab308','📅')}${card('91-180天',b.d180,'#3b82f6','🗓️')}${card('180天以上',b.far,'#10b981','🌙')}</div>`;
  html+=`<div class="card"><div class="card-title">到期明细（按到期先后排序）</div><div class="table-wrap"><table class="tbl">
    <thead><tr><th>到期时间</th><th>剩余</th><th>名称</th><th>平台</th><th>类型</th><th class="num">金额</th><th class="num">到期金额</th><th>操作</th></tr></thead>
    <tbody>${items.map(remindRow).join('')||'<tr><td colspan="8" class="empty">暂无带到期时间的记录</td></tr>'}</tbody></table></div></div>`;
  el.innerHTML=html;
  document.getElementById('rToday').onclick=()=>{refDate=new Date();refDate.setHours(0,0,0,0);syncRefInput();render();toast('基准日已设为今天');};
  el.querySelector('tbody').onclick=e=>{const btn=e.target.closest('button[data-act]');if(btn){e.stopPropagation();openModalById(+btn.dataset.id);}};}
function remindRow(x){const d=x.d,tc=typeColor(d.类型);
  return`<tr class="${urgencyClass(d)}"><td class="mono">${fmtDate(x.mi.date)}</td><td>${maturityBadge(d)}</td><td class="name">${esc(d.名称)}</td><td>${esc(d.平台)}</td>
  <td><span class="tbadge" style="background:${tc}1a;color:${tc};border:1px solid ${tc}40">${esc(d.类型)}</span></td>
  <td class="num mono">${fmtMoney(d.金额)}</td><td class="num mono">${(d.到期金额===''||d.到期金额==null)?'—':fmtMoney(d.到期金额)}</td>
  <td><button class="icon edit" data-act="edit" data-id="${d._id}" title="编辑">✏️</button></td></tr>`;}

/* ===================== 弹窗 CRUD ===================== */
function set(id,v){document.getElementById(id).value=v==null?'':v;}
function openModal(item){editingId=item?item._id:null;
  document.getElementById('modalTitle').textContent=item?'编辑记录':'新增记录';
  set('f_name',item?item.名称:'');
  fillSelect(document.getElementById('f_platform'),DICT.platform,item?item.平台:'');
  fillSelect(document.getElementById('f_type'),DICT.type,item?item.类型:'存款');
  fillSelect(document.getElementById('f_channel'),DICT.channel,item?item.渠道:'','（可不填）');
  set('f_amount',item?item.金额:'');set('f_rate',item?item.利率:'');set('f_term',item?item.期限:'');set('f_maturity',item?item.到期金额:'');
  set('f_start',item&&item.存入时间?toInputDate(parseDate(item.存入时间)):'');set('f_end',item&&item.到期时间?toInputDate(parseDate(item.到期时间)):'');
  set('f_note',item?item.备注:'');document.getElementById('modalMask').classList.add('show');document.getElementById('f_name').focus();}
function openModalById(id){const it=deposits.find(d=>d._id===id);if(it)openModal(it);}
function closeModal(){document.getElementById('modalMask').classList.remove('show');editingId=null;}
function saveForm(){const g=id=>document.getElementById(id).value.trim();
  const item={名称:g('f_name'),平台:g('f_platform'),类型:g('f_type'),渠道:g('f_channel'),金额:num(g('f_amount')),利率:num(g('f_rate')),期限:g('f_term'),到期金额:num(g('f_maturity')),
    存入时间:g('f_start')?fmtDate(parseDate(g('f_start'))):'',到期时间:g('f_end')?fmtDate(parseDate(g('f_end'))):'',备注:g('f_note')};
  if(!item.名称&&!item.平台){toast('请至少填写名称或平台','err');return;}
  if(!item.平台){toast('请选择平台 / 银行','err');return;}
  if(editingId==null){item.序号=deposits.length?Math.max(...deposits.map(d=>Number(d.序号)||0))+1:1;item._id=++idCounter;deposits.push(item);toast('✅ 已新增记录');}
  else{const i=deposits.findIndex(d=>d._id===editingId);if(i>=0){item._id=editingId;item.序号=deposits[i].序号;deposits[i]=item;}toast('✅ 已保存修改');}
  saveLocal();closeModal();render();}
function deleteItem(id){const it=deposits.find(d=>d._id===id);if(!it)return;
  if(confirm(`确定删除「${it.名称||it.平台}」（${fmtMoney(it.金额)}）吗？`)){deposits=deposits.filter(d=>d._id!==id);saveLocal();render();toast('🗑️ 已删除');}}
function calcMaturity(){const amt=num(document.getElementById('f_amount').value),rate=num(document.getElementById('f_rate').value),term=parseFloat(document.getElementById('f_term').value);
  if(amt&&rate&&term){document.getElementById('f_maturity').value=(amt*(1+rate/100*term/365)).toFixed(2);toast('🧮 已按单利估算');}else toast('请先填写金额、利率、期限','err');}

/* ===================== Excel 导入导出 ===================== */
function exportExcel(){if(typeof XLSX==='undefined'){toast('Excel 组件未加载（需联网）','err');return;}
  const rows=deposits.map(d=>{const mi=maturityInfo(d);
    return{'序号':d.序号,'名称':d.名称,'平台':d.平台,'类型':d.类型,'渠道':d.渠道,'金额':num(d.金额),'利率':num(d.利率),'期限':d.期限,'到期金额':num(d.到期金额),
      '存入时间':parseDate(d.存入时间)?fmtDate(parseDate(d.存入时间)):'','到期时间':parseDate(d.到期时间)?fmtDate(parseDate(d.到期时间)):'',
      '到期提醒':mi?(mi.days<0?'已到期'+(-mi.days)+'天':mi.days+'天后到期'):'','备注':d.备注};});
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:6},{wch:22},{wch:22},{wch:14},{wch:16},{wch:12},{wch:8},{wch:12},{wch:12},{wch:12},{wch:12},{wch:14},{wch:26}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'资金');
  XLSX.writeFile(wb,'资金大管家_'+toInputDate(new Date())+'.xlsx');toast('📤 已导出 Excel');}
function importExcel(file){if(typeof XLSX==='undefined'){toast('Excel 组件未加载（需联网）','err');return;}
  const reader=new FileReader();reader.onload=e=>{try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    const items=rows.map((r,i)=>({序号:i+1,名称:r['名称']||'',平台:r['平台']||'',类型:r['类型']||'',渠道:r['渠道']||'',金额:num(r['金额']),利率:num(r['利率']),期限:r['期限']||'',到期金额:num(r['到期金额']),
      存入时间:parseDate(r['存入时间'])?fmtDate(parseDate(r['存入时间'])):'',到期时间:parseDate(r['到期时间'])?fmtDate(parseDate(r['到期时间'])):'',备注:r['备注']||''}))
      .filter(it=>it.名称||it.平台||it.金额);
    if(!items.length){toast('未读取到有效数据','err');return;}
    if(confirm(`读取到 ${items.length} 条记录，导入将替换当前数据。继续？`)){
      deposits=items;assignIds();mergeDict(items);saveLocal();render();toast('📥 导入成功，共 '+items.length+' 条');}
  }catch(err){toast('解析失败：'+err.message,'err');}};reader.readAsArrayBuffer(file);}

/* ===================== 渲染调度 ===================== */
function renderCurrentTab(){if(currentTab==='list')renderList();else if(currentTab==='stats')renderStatsTab();else renderRemind();}
function render(){renderOverview();renderCurrentTab();}
function switchTab(t){currentTab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');renderCurrentTab();}
function syncRefInput(){document.getElementById('refDateInput').value=toInputDate(refDate);}

/* ===================== 初始化 ===================== */
function init(){
  loadDict();
  if(!loadLocal()){deposits=SAMPLE();assignIds();}
  mergeDict(deposits);
  syncRefInput();
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
  document.getElementById('addBtn').onclick=()=>openModal(null);
  document.getElementById('exportBtn').onclick=exportExcel;
  document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange=e=>{if(e.target.files[0])importExcel(e.target.files[0]);e.target.value='';};
  document.getElementById('sampleBtn').onclick=()=>{if(confirm('重新生成随机示例数据？当前数据将被覆盖。')){deposits=SAMPLE();assignIds();saveLocal();render();toast('已生成随机示例数据');}};
  document.getElementById('clearBtn').onclick=()=>{if(confirm('确定清空全部数据？')){deposits=[];saveLocal();render();toast('已清空');}};
  document.getElementById('refDateInput').onchange=e=>{const d=parseDate(e.target.value);if(d){refDate=d;render();}};
  document.getElementById('todayBtn').onclick=()=>{refDate=new Date();refDate.setHours(0,0,0,0);syncRefInput();render();toast('基准日已设为今天');};
  document.getElementById('modalClose').onclick=closeModal;
  document.getElementById('cancelBtn').onclick=closeModal;
  document.getElementById('saveBtn').onclick=saveForm;
  document.getElementById('calcBtn').onclick=calcMaturity;
  document.getElementById('modalMask').onclick=e=>{if(e.target.id==='modalMask')closeModal();};
  document.getElementById('f_start').addEventListener('change',()=>calcEnd(false));
  document.getElementById('f_term').addEventListener('input',()=>calcEnd(false));
  document.getElementById('calcEndBtn').onclick=()=>calcEnd(true);
  document.getElementById('dictBtn').onclick=openDict;
  document.getElementById('dictFromForm').onclick=openDict;
  document.getElementById('dictClose').onclick=closeDict;
  document.getElementById('dictDone').onclick=closeDict;
  document.getElementById('dictMask').onclick=e=>{if(e.target.id==='dictMask')closeDict();};
  document.getElementById('dictReset').onclick=()=>{if(confirm('恢复为默认选项库？自定义添加的选项将被清除。')){DICT=defaultDict();saveDict();renderDict();refreshFormSelects();toast('已恢复默认选项');}};
  const grid=document.getElementById('dictGrid');
  grid.addEventListener('click',e=>{
    const x=e.target.closest('.chip-x');if(x){dictDel(x.dataset.k,x.dataset.v);return;}
    const add=e.target.closest('button[data-add]');if(add){const k=add.dataset.add;dictAdd(k,document.getElementById('dict-in-'+k).value);}});
  grid.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.dictkey){e.preventDefault();dictAdd(e.target.dataset.dictkey,e.target.value);e.target.value='';}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){
    if(document.getElementById('dictMask').classList.contains('show'))closeDict();else closeModal();}});
  render();}
init();
</script>
